{% load static %}
<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/estudiantes.css' %}">
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Estudiante</title>
</head>
<body>
    <h2>Registrar Estudiante</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if form.errors %}
            <div class="errorlist">{{ form.errors }}</div>
        {% endif %}
        <button type="submit">Guardar</button>
    </form>
    <div class="acciones">
        <a href="{% url 'listaestu' %}">⬅ Volver a la lista</a>
    </div>
</body>
</html>
